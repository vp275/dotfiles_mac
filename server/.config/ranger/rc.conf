# Ranger overrides
#
# Ranger loads its bundled defaults before this file. Keep only local
# overrides here so the complete default configuration is not parsed twice.


# Avoid listing every visible directory solely to display its item count.
set automatically_count_files false

# Do not launch the preview pipeline for files larger than 5 MiB.
set preview_max_size 5242880

# Refresh externally changed directories more promptly.
set idle_delay 500

# Preserve queued keystrokes if filesystem or preview work briefly falls behind.
set flushinput false
