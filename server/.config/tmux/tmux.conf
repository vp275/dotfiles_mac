# Keep tmux helper scripts and standard Ubuntu tools available to plugins.
set-environment -g PATH "$HOME/.local/bin:/usr/local/bin:/usr/bin:/bin"

# Tmux clipboard integration (works in X with xclip installed).
set -g escape-time 0
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm-256color:Tc"
set -as terminal-overrides ",xterm-ghostty:Tc"
set -as terminal-overrides ",tmux-256color:Tc"
set -g focus-events on
set -g mouse on
# Smoother mouse-wheel scrolling: 1 line per wheel event instead of the default chunk
bind -T copy-mode-vi WheelUpPane   send-keys -X -N 2 scroll-up
bind -T copy-mode-vi WheelDownPane send-keys -X -N 2 scroll-down
set -g history-limit 20000
set -g set-clipboard on
setw -g mode-keys vi
set -g extended-keys on
set -g extended-keys-format csi-u

# Use Ctrl+a as the prefix.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Mac-style bindings (requires terminal to send Command as Meta).
bind -n M-d split-window -h -c "#{pane_current_path}"
bind -n M-D split-window -v -c "#{pane_current_path}"
bind -n M-t new-window
bind -n M-w kill-pane
bind -n M-W kill-window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-[ previous-window
bind -n M-] next-window
bind -n C-Tab next-window
bind -n C-S-Tab previous-window
# Ghostty remaps Ctrl+Tab to Ctrl+Right/Left.
bind -n C-Right next-window
bind -n C-Left previous-window
bind -n M-R source-file ~/.config/tmux/tmux.conf \; display-message "Reloaded ~/.config/tmux/tmux.conf"
bind -n M-f copy-mode \; command-prompt -i -p "search" "send-keys -X search-forward-incremental '%%'"
bind -n M-e display-popup -E "~/.local/bin/tmux-flat-picker"
bind -n M-E display-popup -E "~/.local/bin/tmux-session-picker"
bind -n M-s choose-session
bind -n M-n command-prompt -p "New session name:" "new-session -s '%%'"
bind -n M-o run-shell ~/.local/share/tmux/plugins/tmux-sessionx/scripts/sessionx.sh
# tmux-resurrect: save/restore sessions
bind -n M-S run-shell ~/.local/share/tmux/plugins/tmux-resurrect/scripts/save.sh
bind -n M-T run-shell ~/.local/share/tmux/plugins/tmux-resurrect/scripts/restore.sh
bind -n M-z resize-pane -Z
bind -n M-a copy-mode
bind -n 'C-`' display-popup -E -w 24 -h 7 "~/.local/bin/tmux-session-cycler"
bind -n M-x switch-client -l
bind C-q kill-session
bind -n 'M-`' select-pane -t :.+
bind -n 'M-~' select-pane -t :.-

# Auto-name windows based on current directory.
set -g automatic-rename on
setw -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'

# Track window focus for MRU sorting in flat picker.
set-hook -g window-linked "run-shell -b '~/.local/bin/tmux-record-focus #{session_name}:#{window_index}'"
set-hook -g session-window-changed "run-shell -b '~/.local/bin/tmux-record-focus #{session_name}:#{window_index}'"
set-hook -g client-session-changed "run-shell -b '~/.local/bin/tmux-record-focus #{session_name}:#{window_index}'"

# Start window and pane numbering at 1.
set -g base-index 1
setw -g pane-base-index 1

# Thicker pane borders for better visibility.
set -g pane-border-lines heavy

# Copy selections through tmux's OSC 52 support to the local SSH terminal.
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel
bind -T copy-mode y send-keys -X copy-selection-and-cancel

# Status bar using terminal-default colors.
set -g status on
set -g status-interval 900
set -g status-position bottom
set -g status-justify left
set -g status-style "fg=default,bg=default"
set -g status-left-style "fg=default,bg=default,bold"
set -g status-right-style "fg=default,bg=default"
set -g status-left-length 40
set -g status-right-length 120
set -g status-left " #{session_name} |"
set -g status-right "🗽 NY #(TZ=America/New_York date +%%H:%%M) 󰃭 %d %b  %H:%M "
setw -g window-status-style "fg=default,bg=default"
setw -g window-status-format " #I:#{=/10/…:window_name} "
setw -g window-status-current-style "fg=default,bg=default,reverse,bold"
setw -g window-status-current-format " #I:#{=/10/…:window_name}#{?window_zoomed_flag, 🔴,} "
setw -g window-status-separator " "

# TPM (tmux plugin manager)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'omerxx/tmux-sessionx'

# tmux-continuum: auto-save every 15 mins, auto-restore on tmux start
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

run '~/.local/share/tmux/plugins/tpm/tpm'
